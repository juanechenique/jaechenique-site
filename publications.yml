- type: working
  area: Early Childhood Interventions
  title: 'Comprehensive Early Childhood Development Support Systems and Academic Achievement: The Case of Chile Crece Contigo'
  url: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5058558
  url_text: SSRN
  abstract: |-
    This paper studies the effects of a comprehensive early childhood support system on human capital accumulation. Specifically, we explore differences in educational achievement of the first generations of children exposed to the comprehensive child development support system "Chile Crece Contigo." To study this, we exploit the gradual implementation of the policy and the age eligibility requirements to estimate the returns of availability of the policy on data from seven cohorts (2012-2018) of fourth-grade students in Chile. We find sizable positive effects in mathematics (0.21 of a standard deviation) and language (0.23 of a standard deviation) test scores for children in municipalities that started the program during or before their prenatal stage compared to children that the program began when they were older than sixty months. Estimates from an event-study design show that the exposure returns dissipated for children thirty-six months old or older when the policy started. This result is consistent with the schedule of interventions and early detection instruments established. When we look at the difference in the returns to exposure across gender and socioeconomic status, we find evidence that (i) comprehensive child support system has higher returns on boys, which could be explained partially by differences in access to need-based services, (ii) these differences across gender differences occur in children with higher levels of exposure, and (iii) we do not find relevant differences between students classified as low-socioeconomic background and not classified in this category.

    Keywords: Chile Crece Contigo, long-term return, early childhood interventions.
- type: working
  area: Early Childhood Interventions
  title: 'Take-Up Rates and Intervention Effectiveness of Early Childhood Stimulation Services: Insights from Chile Crece Contigo'
  abstract: |-
    In this paper, I study a novel service offered by Chile Crece Contigo: the stimulation workshops. This service consists of workshops for children and their parents designed to foster the learning process of children lagging in their development based on age-based psychomotor benchmarks. Using electronic health records from families receiving primary care in the public health system in an urban district in Santiago, Chile, I characterize the population eligible for these services and study the factors related to the probability of take-up for the services offered. Based on observable characteristics and baseline evaluations, it is possible to observe that parents of children in the lower part of the distribution of psychomotor development choose to participate in the treatment, indicating positive sorting into the treatment.

    Then, conditional on selection into treatment, I test if the treatment can meet its target of closing the gap in human capital formation between children who received help to enhance their development trajectory and those who followed the usual path of development. For this, I use the total score of the screening test at follow-up as the outcome of interest and a categorical variable indicating whether the child achieves their developmental milestone at follow-up. Our results show that children who comply with the referral for services show improvement. However, these gains do not close the gap from the baseline period to comply with developmental benchmarks. This result, combined with the sorting of participants, provides an explanation for the limited results from aggregated indicators used by policymakers.
