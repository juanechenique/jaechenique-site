- type: working
  area: Food Policy and Nutrition
  title: 'Front-of-package food labeling policies and child nutrition: Lessons from Chile''s comprehensive food policy reform'
  authors: with Agustina Laurito
  note: Draft upon request
  abstract: In 2022, the prevalence of children under the age of five classified as overweight or obese was 8.6% (UNICEF, WHO, World Bank 2023). This condition does not only affect other aspects of a child's health in the short run but increases their risk of chronic illnesses such as diabetes and hypertension in the long run. In recent years, food labeling policies have gained popularity as a public health intervention to tackle obesity in the general population. Front-of-package policies are one such policy that has been proposed to help consumers make informed food choices. Food packages often display simple information on the front indicating whether a product is healthy or unhealthy if the amount of sugar and fat exceeds specific ranges. The first version of this policy was implemented in Chile in 2016 and later implemented in 25 countries worldwide (Barahona et al., 2022). Previous research regarding this experience has found a reduction in calorie and sugar intake by 6% and 9%, respectively, via the reformulation of products and substitution within the category (Barahona, Otero, and Otero, 2023). This paper studies the effects of the first mandatory front-of-package policy on children's weight trajectories using two data sources. First, we will test for short-run changes in nutritional status in children, exploiting the level of exposure to the policy across multiple rounds of the Early Childhood Longitudinal Survey (ELPI). Then, we examine the changes in the nutritional status of school-aged children, for which the policy also introduced restrictions to the sales of products labeled as high-in-fat or high-in-sugars within the schools. We use the Nutritional Maps Survey collected by the National Board of School Assistance and Scholarships (JUNAEB), which collects anthropometric measurements for pre-k, kindergarten, first-grade, and high-school first-year children. Using a fixed-effects model, we test for changes in the proportion of children with malnutrition by excess at the school level during the years preceding the law's enactment.
- type: working
  area: Food Policy and Nutrition
  title: Supply Pricing Responses to Sugar-Sweetened Beverage Taxes at a Large National Fast-Food Chain
  authors: with B. Elbel, H. Wu, S. Desai, P. Rummo, T. Mijanovich, M. Bragg, and B. Weitzman
  status: Submitted
  url: https://papers.ssrn.com/sol3/Delivery.cfm/4961670.pdf?abstractid=4961670&mirid=1
  url_text: SSRN
  abstract: Over one-third of adults consume fast food daily, including sugar-sweetened beverages (SSBs) that contain more than the recommended daily allowance of calories from added sugars in just one serving. Taxes on sweetened beverages are a promising solution to reduce the consumption of these beverages and their potential contribution to obesity. However, policies must satisfy two conditions to affect the demand for these products. Firstly, the tax must be passed on from producers to consumers through higher prices. Secondly, the demand for these items should be less than perfectly inelastic. This paper focuses on the first condition, examining the pass-through of taxes on sweetened beverages in fast-food beverage prices in five US localities that implemented taxes between 2017-2018. The study leverages detailed national purchase data from Taco Bell locations between 2015 and 2020. Using an event-study design combined with a synthetic control counterfactual, we tested for price changes per ounce of single-served beverages and beverages bundles with menu items. The results showed that the amount of tax passed through to consumers varied by locality during the first two years post-tax. We find evidence of a complete pass-through on single-served beverages in cities taxing sugar and artificially sweetened beverages (Philadelphia, PA, and Cook County, IL). Conversely, we find no significant price changes in locations that taxed only sugar-sweetened beverages (Seattle, WA, Albany, CA, and Oakland, CA). The restaurant responses remained consistent into the second year post-tax in the four locations that retained the tax. These findings underscore the significance of tax design.
- type: working
  area: Food Policy and Nutrition
  title: Relationship between community characteristics and impact of sugar-sweetened beverage taxes on fast-food purchases
  authors: R. Dupuis, M. Bragg, E. Wu, L. Heng, E. Hafeez, T. Mijanovich, B. Weitzman, J. A. Echenique, P. Rummo, B. Elbel
