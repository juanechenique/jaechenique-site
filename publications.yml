- type: working
  area: Mental Health
  title: School Instructional Choices and Mental Health Outcomes Post-Lockdown
  authors: with Amy Ellen Schwartz and B. Elbel
  abstract: 'This paper focuses on understanding how modes of instruction (fully remote vs. hybrid in-person and remote) affected New York City (NYC) students during the reopening of schools after instruction shifted to remote during the spring semester of 2019-20 as a response to the COVID-19 pandemic. Parents/guardians were offered the option of students returning to classes in a blended learning mode (hybrid) or fully remote instruction. The paper contributes to understanding the long-term implications of COVID-19 restrictions and the role of instruction modalities as determinants for children''s mental health status and academic achievement. We use a recently established unique longitudinal dataset of individual-level data on all NYC K-12 public school children, combining healthcare usage and educational administrative records. We leverage two sources of variation: the choices of parents for the mode of instruction and the staggered reopening of schools based on the student''s grade. First, we estimate the parents'' preferences for blended learning for the 2020-2021 school year based on demographic characteristics, physical and mental health status, neighborhood infection rates, school infrastructure, and travel time to school. Then, we estimate the effects of attending in person on multiple indicators of mental health status (ED visits, outpatient care, and prescription drugs). Finally, we estimate the impact on students'' outcomes (disciplinary actions, absenteeism, academic achievement, and mental health diagnoses) during the 2021-2022 school year when schools completed their reopening. Preliminary results show that female middle and high school students attending in person, conditional on the choice to return to school in hybrid mode, have a lower probability of an emergency department visit related to mental health than students in remote instruction.'
- type: working
  area: Mental Health
  title: The Effect of State Training Requirements on School-Based Suicide Prevention
  authors: with Anna Strassmann Mueller, Kim Bryan, and Coady Wing
  abstract: |-
    Between 2001 and 2023, 38 states have passed laws that set requirements for suicide prevention training among public school staff. These regulations vary across states regarding the type, quality, and length of training required and the financial support available for implementing the training requirements. Suicide prevention gatekeeper training is arguably one of the best strategies we have to improve youth suicide prevention, but understanding when and how it works to benefit youth is critical.

    We present a novel dataset tracking the implementation and requirements of suicide prevention training state-level policies. This allows us to discuss the details of the policies across states, offering some insight into the actual stringency of the reforms and the potential these reforms have for suicide prevention. Based on this dataset, we study its impact on multiple outcomes related to the suicide behavior of youth affected by leveraging the staggered rollout across the states between the period of the study to implement an event-study design. Specifically, we implement our design with the estimator proposed by Callaway and Sant'Anna (2021), allowing us to explore the possible heterogeneity in the effects of suicide prevention training.

    The first outcome of our interest is the state-level youth (5-19 years) suicide rates from the National Center for Health Statistics 1999–2021 multiple cause-of-death mortality files. Our first set of results found no significant overall treatment effect and limited positive returns between 1 and 3 decreases in the rate per 100,000 for states that enacted policies earlier in this period. Additionally, we estimate the effects of policies, which, based on the length of the training and its evidence-based content, could be qualified as high-quality policies, with results consistent overall with the broader definition of treatment. Nevertheless, the results by year of implementation show some variation in the states showing positive effects based on the definition used as a high-quality policy. Moreover, our identification strategy shows no impact on the state-level suicide rate for people 45-59.
- type: working
  area: Mental Health
  title: Access and Equity of School-Based Mental Health in NYC Public Schools
  authors: with M. Mitsdarffer, B. Elbel, and A. E. Schwartz
  abstract: |-
    Over the last decade, school-based mental health (SBMH) resources in New York City (NYC) public schools, including Article 31 and 28 clinics, staff training, and counselors, have expanded to address students' growing mental health needs. This study examines the distribution and impact of these resources amid an emerging youth mental health crisis, exacerbated by the COVID-19 pandemic, during which mental health-related emergency department (ED) visits surged. Using administrative data from NYC public schools and Medicaid claims, we analyze two critical questions: (1) Which students are most likely to access SBMH resources? and (2) Is access to these resources associated with reduced mental health-related ED visits during the pandemic?

    To address the first question, we use a regression model to estimate the probability that a school offers SBMH services, incorporating predictors such as the demographic composition of students, school characteristics (e.g., grade span, co-location), and infrastructure indicators. For the second question, we examine the relationship between SBMH service access and ED visits, hypothesizing that greater pre-pandemic resource access correlates with lower ED visits and that disparities in access exacerbate mental health outcome disparities. Our population of interest includes 6th–12th grade students enrolled in NYC public schools (excluding special education and specialized schools) from 2019 to 2022. By integrating data on SBMH service availability, student demographics, and health outcomes, this study aims to illuminate disparities in SBMH access and inform equitable mental health policy interventions for youth.

    Our results show that schools serving Hispanic/Latino students have a 1.4 percentage point higher probability of offering SBMH services for every 10 percent increase in that student population, compared to schools serving a larger proportion of Black students, with even larger differences observed in comparison to schools serving White and Asian students. Additionally, we observe that high schools have a higher probability of receiving SBMH services. However, recent findings in the literature indicate the need to expand these services to schools serving sixth to eighth-grade students to prevent severe outcomes later.
